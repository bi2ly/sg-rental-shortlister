name: Daily shortlist

on:
  # Started at 07:47 and 19:47 Singapore time by cron-job.org, which calls
  # GitHub's "run workflow" API (GitHub's own schedule ran up to 4 hours late).
  workflow_dispatch:
    inputs:
      source:
        description: "Listing source"
        type: choice
        options: [propertyguru, all]
        default: propertyguru
      new_only:
        description: "Only alert on listings not sent before (untick to resend everything current)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-shortlist
  cancel-in-progress: false

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data/ holds the "last run" time, building coordinates and market rents.
      # It is cached between runs (never committed: the repo is public).
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: shortlister-data-${{ github.run_id }}
          restore-keys: shortlister-data-

      - name: Collect and shortlist
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "::error::Add the APIFY_TOKEN secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          SOURCE="${{ inputs.source || 'propertyguru' }}"
          NEW_ONLY="${{ inputs.new_only }}"
          FLAGS="--live --source $SOURCE --report report.md --telegram"
          if [ "$NEW_ONLY" = "true" ]; then FLAGS="$FLAGS --new-only"; fi
          python -m shortlister collect $FLAGS
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: shortlister-data-${{ github.run_id }}

      - name: Keep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shortlist-${{ github.run_id }}
          path: report.md
          if-no-files-found: ignore
          retention-days: 30
